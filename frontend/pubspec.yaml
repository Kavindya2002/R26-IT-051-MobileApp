name: eldercare_flutter
description: Elder Care monitoring app - Flutter frontend for the FastAPI backend
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  flutter_tts: ^4.0.2
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/aegiscare_logo.png
    - assets/avatars/